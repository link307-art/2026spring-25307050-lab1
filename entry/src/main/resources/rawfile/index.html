<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Particle System</title>
    <style>
        :root {
            --bg-glass: rgba(15, 15, 25, 0.7);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-color: #e0e0e0;
            --accent-color: #4f46e5;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #020208; font-family: sans-serif; color: var(--text-color); user-select: none;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .glass-panel {
            background: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass); border-radius: 16px; padding: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); z-index: 10; position: absolute;
        }
        #control-panel { top: 15px; right: 15px; width: 240px; display: flex; flex-direction: column; gap: 15px; }
        .panel-section { display: flex; flex-direction: column; gap: 8px; }
        .panel-section h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #88889c; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .preset-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass);
            color: var(--text-color); padding: 10px; border-radius: 8px; cursor: pointer; transition: all 0.3s; font-size: 12px;
        }
        .preset-btn.active { background: var(--accent-color); border-color: #818cf8; box-shadow: 0 0 10px rgba(79, 70, 229, 0.4); }
        .control-group { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        label { font-size: 12px; }
        input[type="range"] { flex: 1; -webkit-appearance: none; background: rgba(255, 255, 255, 0.1); height: 4px; border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent-color); }
        input[type="color"] { -webkit-appearance: none; border: none; width: 35px; height: 25px; background: transparent; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border-glass); border-radius: 4px; }
        #camera-container { bottom: 15px; left: 15px; width: 140px; height: 105px; padding: 4px; }
        #webcam { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; transform: scaleX(-1); background: #000; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; letter-spacing: 1px; z-index: 100; pointer-events: none; transition: opacity 0.5s; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="loading">正在载入实时 3D 交互引擎...</div>
<div id="canvas-container"></div>
<div id="control-panel" class="glass-panel">
    <div class="panel-section">
        <h3>预设模型</h3>
        <div class="btn-grid">
            <button class="preset-btn active" onclick="changePreset('moon')">月球</button>
            <button class="preset-btn" onclick="changePreset('neptune')">海王星</button>
            <button class="preset-btn" onclick="changePreset('pluto')">冥王星</button>
            <button class="preset-btn" onclick="changePreset('heart')">爱心</button>
        </div>
    </div>
    <div class="panel-section">
        <h3>参数调整</h3>
        <div class="control-group">
            <label>基础颜色</label>
            <input type="color" id="baseColor" value="#ffffff">
        </div>
        <div class="control-group">
            <label>粒子密度</label>
            <input type="range" id="density" min="5000" max="30000" step="1000" value="15000">
        </div>
    </div>
</div>
<div id="camera-container" class="glass-panel">
    <video id="webcam" autoplay playsinline></video>
</div>

<script id="vertexShader" type="x-shader/x-vertex">
    uniform float uTime; uniform float uSpread; uniform vec3 uBaseColor; uniform mat4 uHandRotation;
    attribute float aSize; attribute vec3 aRandomDir;
    varying vec3 vColor; varying float vAlpha;
    vec3 hsl2rgb(vec3 c) {
        vec3 rgb = clamp(abs(mod(c.x*6.0+vec3(0.0,4.0,2.0),6.0)-3.0)-1.0, 0.0, 1.0);
        return c.z + c.y * (rgb-0.5)*(1.0-abs(2.0*c.z-1.0));
    }
    void main() {
        vec3 pos = position + aRandomDir * uSpread * 1.5;
        vec4 rotatedPos = uHandRotation * vec4(pos, 1.0);
        vec4 mvPosition = modelViewMatrix * rotatedPos;
        gl_Position = projectionMatrix * mvPosition;
        float angle = atan(rotatedPos.z, rotatedPos.x);
        float hueShift = (angle + 3.14159) / (2.0 * 3.14159);
        vColor = hsl2rgb(vec3(mod(hueShift + uTime * 0.05, 1.0), 0.8, 0.6)) * uBaseColor;
        vAlpha = smoothstep(25.0, 5.0, length(pos));
        gl_PointSize = aSize * (300.0 / -mvPosition.z);
    }
</script>
<script id="fragmentShader" type="x-shader/x-fragment">
    varying vec3 vColor; varying float vAlpha;
    void main() {
        vec2 center = gl_PointCoord - vec2(0.5);
        float dist = length(center);
        if (dist > 0.5) discard;
        float glow = exp(-dist * 6.0);
        gl_FragColor = vec4(vColor * glow * 2.0, vAlpha * glow);
    }
</script>

<script>
    let scene, camera, renderer, mainParticleMesh = null, backgroundParticles;
    let currentPreset = 'moon', targetRotation = new THREE.Matrix4(), currentRotation = new THREE.Matrix4();
    let targetSpread = 0.0, currentSpread = 0.0, clock = new THREE.Clock();
    const shaderUniforms = { uTime: { value: 0 }, uSpread: { value: 0 }, uBaseColor: { value: new THREE.Color(0xffffff) }, uHandRotation: { value: new THREE.Matrix4() } };

    function initThree() {
        scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x020208, 0.015);
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000); camera.position.z = 18;
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        createBackgroundSpace(); generateModel();
        window.addEventListener('resize', onWindowResize); setupUIListeners();
    }

    function generateModel() {
        if (mainParticleMesh) scene.remove(mainParticleMesh);
        const count = parseInt(document.getElementById('density').value);
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3), sizes = new Float32Array(count), randomDirs = new Float32Array(count * 3);
        shaderUniforms.uBaseColor.value.set(document.getElementById('baseColor').value);

        for (let i = 0; i < count; i++) {
            let p = new THREE.Vector3();
            if (currentPreset === 'moon') {
                const u = Math.random(), v = Math.random();
                const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
                const crater = 5.0 + Math.sin(theta*5.0)*Math.cos(phi*5.0)*0.2;
                p.set(crater * Math.sin(phi) * Math.cos(theta), crater * Math.sin(phi) * Math.sin(theta), crater * Math.cos(phi));
            } else if (currentPreset === 'neptune') {
                if(Math.random() > 0.4) {
                    const theta = Math.random() * Math.PI * 2, phi = Math.acos((Math.random() * 2) - 1), r = 4.0 + Math.random() * 0.3;
                    p.set(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
                } else {
                    const r = 6.5 + Math.random() * 2.5, theta = Math.random() * Math.PI * 2;
                    p.set(r * Math.cos(theta), (Math.random() - 0.5) * 0.1, r * Math.sin(theta));
                }
            } else if (currentPreset === 'pluto') {
                const theta = Math.random() * Math.PI * 2, phi = Math.acos((Math.random() * 2) - 1);
                const r = (Math.random() > 0.8) ? (5.0 + Math.random() * 3.0) : (3.5 + Math.random() * 0.5);
                p.set(r * Math.sin(phi) * Math.cos(theta) * 1.2, r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
            } else if (currentPreset === 'heart') {
                const t = Math.PI * (2 * Math.random() - 1), phi = Math.PI * (Math.random() - 0.5);
                p.set(16 * Math.pow(Math.sin(t), 3.0), 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t), phi * 10.0 * (1.0 - Math.abs(t)/Math.PI));
                p.multiplyScalar(0.35);
            }
            positions[i*3] = p.x; positions[i*3+1] = p.y; positions[i*3+2] = p.z;
            const dir = p.clone().normalize();
            randomDirs[i*3] = dir.x; randomDirs[i*3+1] = dir.y; randomDirs[i*3+2] = dir.z;
            sizes[i] = Math.random() * 2.0 + 0.5;
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
        geometry.setAttribute('aRandomDir', new THREE.BufferAttribute(randomDirs, 3));
        mainParticleMesh = new THREE.Points(geometry, new THREE.ShaderMaterial({
            vertexShader: document.getElementById('vertexShader').textContent,
            fragmentShader: document.getElementById('fragmentShader').textContent,
            uniforms: shaderUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        }));
        scene.add(mainParticleMesh);
    }

    function createBackgroundSpace() {
        const bgCount = 8000, geometry = new THREE.BufferGeometry(), positions = new Float32Array(bgCount * 3);
        for (let i = 0; i < bgCount * 3; i++) { positions[i] = (Math.random() - 0.5) * 150; }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        backgroundParticles = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.3, color: 0x7788aa, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending }));
        scene.add(backgroundParticles);
    }

    function initMediaPipe() {
        const videoElement = document.getElementById('webcam');
        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        hands.onResults(onHandResults);
        const cameraUtils = new Camera(videoElement, { onFrame: async () => { await hands.send({ image: videoElement }); }, width: 320, height: 240 });
        cameraUtils.start().then(() => { document.getElementById('loading').style.opacity = 0; });
    }

    function onHandResults(results) {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];
            const dist = Math.sqrt(Math.pow(landmarks[4].x - landmarks[20].x, 2) + Math.pow(landmarks[4].y - landmarks[20].y, 2));
            targetSpread = Math.max(0.0, Math.min(3.5, (dist - 0.15) * 6.0));
            const euler = new THREE.Euler((landmarks[0].y - 0.5) * Math.PI * 1.5, (landmarks[0].x - 0.5) * Math.PI * 1.5, 0, 'XYZ');
            targetRotation.makeRotationFromEuler(euler);
        } else { targetSpread = 0.0; }
    }

    function changePreset(type) {
        currentPreset = type;
        document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        const cp = document.getElementById('baseColor');
        if (type === 'moon') cp.value = '#ffffff';
        else if (type === 'neptune') cp.value = '#2b66ff';
        else if (type === 'pluto') cp.value = '#a19085';
        else if (type === 'heart') cp.value = '#ffb3cc';
        generateModel();
    }

    function setupUIListeners() {
        document.getElementById('baseColor').addEventListener('input', (e) => { shaderUniforms.uBaseColor.value.set(e.target.value); });
        document.getElementById('density').addEventListener('change', () => { generateModel(); });
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime(); shaderUniforms.uTime.value = time;
        currentSpread += (targetSpread - currentSpread) * 0.1; shaderUniforms.uSpread.value = currentSpread;
        let qT = new THREE.Quaternion().setFromRotationMatrix(targetRotation), qC = new THREE.Quaternion().setFromRotationMatrix(currentRotation);
        qC.slerp(qT, 0.08); currentRotation.makeRotationFromQuaternion(qC);
        currentRotation.multiply(new THREE.Matrix4().makeRotationY(0.005)); shaderUniforms.uHandRotation.value.copy(currentRotation);
        backgroundParticles.rotation.y = time * 0.015; backgroundParticles.rotation.x = time * 0.008;
        renderer.render(scene, camera);
    }

    window.onload = () => { initThree(); initMediaPipe(); animate(); };
</script>
</body>
</html>
